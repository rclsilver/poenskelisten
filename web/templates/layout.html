{{/* Loaded with the pages by LoadHTMLGlob. The English text only shows if the dictionary fails to load. */}}

{{define "head"}}
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="{{.appDescription}}">
        <meta name="application-name" content="{{.appName}}">
        <meta name="apple-mobile-web-app-title" content="{{.appName}}">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="color-scheme" content="light dark">
        <meta name="theme-color" content="#f6f3ed" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#1c211d" media="(prefers-color-scheme: dark)">
        <meta name="referrer" content="same-origin">
        <title>{{.appName}}</title>
        <link rel="stylesheet" href="/css/app.css">
        <link rel="manifest" href="/manifest.json">
        <link rel="apple-touch-icon" href="/assets/logos/logo-192x192.png">
        <link rel="icon" type="image/png" href="/assets/favicons/favicon-196x196.png" sizes="196x196">
        <link rel="icon" type="image/png" href="/assets/favicons/favicon-32x32.png" sizes="32x32">
        <link rel="icon" type="image/x-icon" href="/assets/favicons/favicon.ico">
        <script src="/js/theme.js"></script>
        <script defer src="/js/core.js"></script>
        <script defer src="/js/session.js"></script>
{{end}}

{{define "appnav"}}
        <a class="skip" href="#main" data-i18n="nav.skip">Skip to content</a>
        <header class="appnav">
            <a class="brand" href="/">
                <span class="brandmark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16v11H4zM3 6h18v4H3zM12 6v15"/><path d="M12 6C5 7 5 0 9 2c2 1 3 4 3 4Zm0 0c7 1 7-6 3-4-2 1-3 4-3 4Z"/></svg>
                </span>
                <span class="brand-name">{{.appName}}</span>
            </a>
            <nav class="navlinks" id="nav-links" aria-label="Main" data-i18n-attr="aria-label:nav.main" hidden></nav>
            <div class="account-nav">
                <details class="menu" id="prefs-menu">
                    <summary class="btn quiet icon" aria-label="Display preferences" data-i18n-attr="aria-label:prefs.title;title:prefs.title">
                        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    </summary>
                    <div class="menu-panel">
                        <label for="pref-theme"><span data-i18n="prefs.theme">Theme</span>
                            <select id="pref-theme">
                                <option value="system" data-i18n="prefs.themeSystem">Same as system</option>
                                <option value="light" data-i18n="prefs.themeLight">Light</option>
                                <option value="dark" data-i18n="prefs.themeDark">Dark</option>
                            </select>
                        </label>
                        <label for="pref-lang"><span data-i18n="prefs.language">Language</span>
                            <select id="pref-lang">
                                <option value="en" lang="en">English</option>
                                <option value="fr" lang="fr">Français</option>
                            </select>
                        </label>
                    </div>
                </details>
                <div class="account-nav" id="nav-account"></div>
            </div>
        </header>
{{end}}

{{define "main"}}
        <main id="main" class="container" tabindex="-1">
            <div class="loading"><div class="spinner" role="status" aria-label="Loading" data-i18n-attr="aria-label:state.loading"></div></div>
        </main>
        <div class="toasts" id="toasts"></div>
        <noscript><p class="container">You need JavaScript to use this website.</p></noscript>
{{end}}
